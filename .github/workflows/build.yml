name: daily-build   # 매일 06:00 KST — 수집→요약→이중 팩트체크→발행(사이트 갱신)

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 KST
  workflow_dispatch: {}     # 수동 실행 버튼(테스트용)

permissions:
  contents: write           # 갱신된 site/·data/ 를 커밋하기 위함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 파이프라인 실행 (취재→해설→이중 팩트체크→발행)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run
      - name: 커밋 & 푸시 (Netlify 가 자동 재배포)
        run: |
          git config user.name  "nachimban-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/index.html data/
          git commit -m "chore: 자동 발행 $(date -u +%F)" || echo "변경 없음"
          git push
