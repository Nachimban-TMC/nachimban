<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>찡곰툰 업로드 · EP13</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --kr:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --paper:#F0DDC6; --ink:#2A2119; --soft:#6B5B49; --faint:#9C8B76;
  --line:#D8C4A8; --panel:#F7EEE0; --bg:#FBF6EE;
}
body{font-family:var(--kr);color:var(--ink);background:var(--bg);line-height:1.6;
  max-width:660px;margin:0 auto;padding:20px 16px 70px}
.hd{border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.hd h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.hd .sub{color:var(--faint);font-size:13px;margin-top:3px}
h2{font-size:15px;font-weight:800;margin:28px 0 5px}
.note{font-size:13px;color:var(--soft);margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid a{display:block;position:relative;text-decoration:none}
.grid img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--paper);
  border:1px solid var(--line);border-radius:5px;display:block}
.grid a.fallback{display:flex;align-items:center;justify-content:center;
  aspect-ratio:4/5;background:var(--paper);border:1px dashed var(--line);border-radius:5px}
.grid .fb{font-size:12px;font-weight:700;color:var(--soft);text-align:center;line-height:1.5}
.grid .i{position:absolute;top:5px;left:5px;background:rgba(42,33,25,.85);color:#fff;
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:8px}
button{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:99px;
  background:var(--ink);color:var(--bg);padding:11px 18px;margin-top:10px;cursor:pointer}
button:active{opacity:.7}
.tip{font-size:12px;color:var(--faint);margin-top:10px}
.ep{margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.ep h3{font-size:14px;font-weight:800;margin-bottom:8px}
@media(prefers-color-scheme:dark){
  :root{--bg:#141210;--panel:#1e1b18;--line:#3a332c;--ink:#EFE7DA;--soft:#B5A794;--faint:#8B7F6E}
}
</style></head><body>

<div class="hd">
  <h1>찡곰툰 업로드</h1>
  <div class="sub">EP13 · 태동이 느껴져요 · 12컷 (4:5)</div>
</div>

<h2>컷 이미지</h2>
<div class="note">이미지를 <b>길게 눌러 저장</b>하세요. 번호 순서대로 저장하면 캐러셀 순서가 맞습니다.</div>
<div class="grid" id="grid"></div>

<h2>캡션</h2>
<div class="cap" id="cap"></div>
<button onclick="cp(CAP,this)">캡션 복사</button>

<h2>첫 댓글용 해시태그</h2>
<div class="cap" id="tag"></div>
<button onclick="cp(TAG,this)">해시태그 복사</button>

<p class="tip">에피소드가 추가되면 이 페이지가 갱신됩니다.</p>

<script>
var BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3GECC5TtJ9AV8a30xaCCexmEilq/";
var CUTS=[
 ["hf_20260902_112346_3395fe64-aaf0-4fe3-90ca-a4eb1e9f74eb.png","제목"],
 ["hf_20260902_112346_d0cb4555-0e50-470e-a1f4-8a8920f43c3f.png","갸우뚱"],
 ["hf_20260902_130337_85d3d444-8002-4726-9bf3-78682262a327.png","1차 호출"],
 ["hf_20260902_150054_b09598a5-b68a-44d5-80e3-6ce5163acd5a.png","시도"],
 ["hf_20260902_150952_a21c1be9-bac0-4209-9b7f-1b991b1c7acb.png","정적"],
 ["hf_20260902_155828_1988b7b7-dffd-4406-bf20-ba1219b1aed4.png","머쓱"],
 ["hf_20260902_155826_c5e3b2ff-ad0d-46e1-a8b1-9afd6c0fc6f5.png","2차 호출"],
 ["hf_20260902_155827_eba60799-6b81-487b-a85a-ab079234593c.png","장운동"],
 ["hf_20260902_160520_3946c69c-80de-45f6-90f5-3c43e1bad4a4.png","양치기 물개"],
 ["hf_20260902_223018_ca6a251e-cc2c-48c1-86f6-4568623e90f0.png","톡"],
 ["hf_20260902_223720_04acae1e-27f2-4983-a73f-c6d9a715b07b.png","슉슉아?"],
 ["hf_20260902_160836_5c0d5cec-6a7e-43ff-9813-5023050406df.png","엔딩"]
];
var g=document.getElementById('grid');
CUTS.forEach(function(c,i){
  var n=String(i+1).padStart(2,'0');
  var a=document.createElement('a');
  a.href=BASE+c[0]; a.target="_blank"; a.rel="noopener";
  a.setAttribute('download','EP13_'+n+'.png');
  a.innerHTML='<span class="i">'+n+'</span><img src="'+BASE+c[0]+'" alt="'+c[1]+'" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'fallback\');this.parentNode.insertAdjacentHTML(\'beforeend\',\'<span class=&quot;fb&quot;>'+c[1]+'<br>열기 →</span>\')">';
  g.appendChild(a);
});

var CAP="태동, 아빠는 언제부터 느낄 수 있을까요 🤰\n\n21주차. 아내는 \"이게 태동인가?\" 갸우뚱하는 단계였어요.\n\n어느 날 \"오빠!!!\" 하고 급하게 부르길래 뛰어갔더니\n배에 손을 얹고 한참… 정적.\n\n두 번째도 \"이번엔 진짜야!\" 하길래 달려갔는데\n이번엔 장운동이었고요. (지난 편에 이어 또)\n\n양치기 물개가 따로 없다 싶던 그때\n손바닥에 톡. 태명을 부르니 폭풍 태동 💓\n\n아내는 진작 느끼고 있었는데\n아빠 손까지 닿기엔 시간이 좀 걸리더라고요.\n\n여러분은 언제 처음 느끼셨나요? 👀\n\n#임신툰 #태동 #임신21주 #부부툰 #독일부부";
var TAG="#임신일기 #예비아빠 #독일살이 #곰과물개 #donyfilm #손그림웹툰 #그림일기 #태동일기";
document.getElementById('cap').textContent=CAP;
document.getElementById('tag').textContent=TAG;
function cp(t,b){navigator.clipboard.writeText(t).then(function(){
  var o=b.textContent;b.textContent='복사됨 ✓';setTimeout(function(){b.textContent=o},1500);});}
</script></body></html>
