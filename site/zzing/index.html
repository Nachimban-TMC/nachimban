<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --kr:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --paper:#F0DDC6; --ink:#2A2119; --soft:#6B5B49; --faint:#9C8B76;
  --line:#D8C4A8; --panel:#F7EEE0; --bg:#FBF6EE;
}
body{font-family:var(--kr);color:var(--ink);background:var(--bg);line-height:1.6;
  max-width:660px;margin:0 auto;padding:20px 16px 70px}
.hd{border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.hd h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.hd .sub{color:var(--faint);font-size:13px;margin-top:3px}
h2{font-size:15px;font-weight:800;margin:28px 0 5px}
.note{font-size:13px;color:var(--soft);margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid a{display:block;position:relative;text-decoration:none}
.grid img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--paper);
  border:1px solid var(--line);border-radius:5px;display:block}
.grid a.fallback{display:flex;align-items:center;justify-content:center;
  aspect-ratio:4/5;background:var(--paper);border:1px dashed var(--line);border-radius:5px}
.grid .fb{font-size:12px;font-weight:700;color:var(--soft);text-align:center;line-height:1.5}
.grid .i{position:absolute;top:5px;left:5px;background:rgba(42,33,25,.85);color:#fff;
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:8px}
button{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:99px;
  background:var(--ink);color:var(--bg);padding:11px 18px;margin-top:10px;cursor:pointer}
button:active{opacity:.7}
.tip{font-size:12px;color:var(--faint);margin-top:10px}
.ep{margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.ep h3{font-size:14px;font-weight:800;margin-bottom:8px}
@media(prefers-color-scheme:dark){
  :root{--bg:#141210;--panel:#1e1b18;--line:#3a332c;--ink:#EFE7DA;--soft:#B5A794;--faint:#8B7F6E}
}
</style></head><body>

<script>

 ["hf_20261030_140003_c2505055-b9c6-4868-83b4-6da8b0ceb531.png","이게 맞나"],
 ["hf_20261030_141436_458dfcab-c18d-4f20-b094-9ce886a22bdc.png","로손"],
 ["hf_20261030_140650_711a2b5e-89e2-4412-a1a5-57305c7edd7d.png","기절"],
 ["hf_20261030_141443_6ef4fab2-7381-4e77-8a1f-a1df29ff62df.png","2편에 계속"]
];
var g=document.getElementById('grid');
function U(f){return f.indexOf('/')>=0?f:BASE+f;}
CUTS.forEach(function(c,i){
  var n=String(i+1).padStart(2,'0');
  var a=document.createElement('a');
  a.href=U(c[0]); a.target="_blank"; a.rel="noopener";

document.getElementById('cap').textContent=CAP;
document.getElementById('tag').textContent=TAG;

var EP='EP19', FILES=null;
async function saveAll(b){
  if(!FILES){ // 1단계: 다 받아두기 (아이폰은 공유창을 바로 띄워야 해서 미리 받는다)
    b.disabled=true; var done=0;
    FILES=await Promise.all(CUTS.map(function(c,i){
      return fetch(U(c[0])).then(function(r){return r.blob();}).then(function(bl){
        b.textContent='받는 중 '+(++done)+'/'+CUTS.length;
        return new File([bl],EP+'_'+String(i+1).padStart(2,'0')+'.png',{type:'image/png'});});
    }));
    b.disabled=false;
  }
  if(navigator.canShare&&navigator.canShare({files:FILES})){
    b.textContent='눌러서 사진에 저장';
    if(b.dataset.ready){ try{await navigator.share({files:FILES});}catch(e){} }
    b.dataset.ready=1; return;
  }
  // 컴퓨터: 한 장씩 연속 다운로드
  for(var f of FILES){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();await new Promise(function(r){setTimeout(r,300);});}
  b.textContent='저장 완료 ✓';
}
function cp(t,b){navigator.clipboard.writeText(t).then(function(){
  var o=b.textContent;b.textContent='복사됨 ✓';setTimeout(function(){b.textContent=o},1500);});}
</script></body></html>
