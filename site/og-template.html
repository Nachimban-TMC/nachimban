<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:#FFFFFF; color:#0A0A0A;
    font-family:"Pretendard","Apple SD Gothic Neo","Helvetica Neue",system-ui,sans-serif;
    display:flex; flex-direction:column; position:relative;
  }
  /* 종이 질감 — 사이트와 같은 결 */
  body::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(10,10,10,.022) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(10,10,10,.016) 0 1px, transparent 1px 4px);
  }
  .top{
    border-bottom:1px solid #0A0A0A; padding:30px 64px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .eyebrow{font-size:17px; font-weight:800; letter-spacing:.30em; text-transform:uppercase;}
  .issue{font-size:15px; font-weight:700; letter-spacing:.18em; color:#4B4B4B;}

  .mid{flex:1; padding:0 64px; display:flex; flex-direction:column; justify-content:center;}
  h1{
    font-size:150px; line-height:.92; font-weight:800; letter-spacing:-.045em;
  }
  .rule{width:104px; height:7px; background:#0A0A0A; margin:34px 0 30px;}
  .tag{
    font-size:31px; line-height:1.45; color:#0A0A0A; font-weight:600; letter-spacing:-.012em;
  }
  .tag b{font-weight:800;}
  .sub{font-size:23px; color:#4B4B4B; margin-top:14px; letter-spacing:-.005em;}

  .bot{
    border-top:1px solid #0A0A0A; padding:24px 64px;
    display:flex; align-items:center; gap:13px;
  }
  .chip{
    border:1.5px solid #0A0A0A; border-radius:999px; padding:8px 20px 9px;
    font-size:15px; font-weight:800; letter-spacing:.13em;
  }
  .chip.solid{background:#0A0A0A; color:#FFFFFF;}
  .site{margin-left:auto; font-size:19px; font-weight:800; letter-spacing:.05em;}
</style></head>
<body>
  <div class="top">
    <div class="eyebrow">Daily Briefing · 7:00 AM</div>
    <div class="issue">재외한인을 위한 아침 브리핑</div>
  </div>

  <div class="mid">
    <h1>나침반</h1>
    <div class="rule"></div>
    <div class="tag">해외에 사는 우리에게 꼭 필요한<br><b>법률 · 복지 · 비자 · 세금</b> 소식만 골라</div>
    <div class="sub">매일 아침 7시, 법률 해설가와 팩트체커 2인이 확인해 전합니다.</div>
  </div>

  <div class="bot">
    <span class="chip solid">GERMANY</span>
    <span class="chip">KOREA</span>
    <span class="chip">EU</span>
    <span class="chip">USA</span>
    <span class="site">nachimban.pages.dev</span>
  </div>
</body></html>
